name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, c83491307-gif-patch-1, "feat/rofof-**"]
  pull_request:
    branches: [main, c83491307-gif-patch-1, feat/rofof-phase0-discovery]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon lintDebug
      - name: Debug APK
        run: gradle --no-daemon assembleDebug
      - name: Instrumented Room tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rofof-android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
