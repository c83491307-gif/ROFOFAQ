name: ROFOF Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: rofof-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build and verify signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require signing secrets
        shell: bash
        env:
          ROFOF_KEYSTORE_BASE64: ${{ secrets.ROFOF_KEYSTORE_BASE64 }}
          ROFOF_KEYSTORE_PASSWORD: ${{ secrets.ROFOF_KEYSTORE_PASSWORD }}
          ROFOF_KEY_ALIAS: ${{ secrets.ROFOF_KEY_ALIAS }}
          ROFOF_KEY_PASSWORD: ${{ secrets.ROFOF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ROFOF_KEYSTORE_BASE64 ROFOF_KEYSTORE_PASSWORD ROFOF_KEY_ALIAS ROFOF_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository Actions secret is missing: $name"
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode and validate signing keystore
        shell: bash
        env:
          ROFOF_KEYSTORE_BASE64: ${{ secrets.ROFOF_KEYSTORE_BASE64 }}
          ROFOF_KEYSTORE_PASSWORD: ${{ secrets.ROFOF_KEYSTORE_PASSWORD }}
          ROFOF_KEY_ALIAS: ${{ secrets.ROFOF_KEY_ALIAS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/rofof-signing"
          printf '%s' "$ROFOF_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rofof-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/rofof-signing/release.jks"
          test -s "$RUNNER_TEMP/rofof-signing/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/rofof-signing/release.jks" \
            -storepass "$ROFOF_KEYSTORE_PASSWORD" -alias "$ROFOF_KEY_ALIAS" >/dev/null
          echo "ROFOF_KEYSTORE_PATH=$RUNNER_TEMP/rofof-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build minified signed Release APK
        shell: bash
        env:
          ROFOF_KEYSTORE_PASSWORD: ${{ secrets.ROFOF_KEYSTORE_PASSWORD }}
          ROFOF_KEY_ALIAS: ${{ secrets.ROFOF_KEY_ALIAS }}
          ROFOF_KEY_PASSWORD: ${{ secrets.ROFOF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:clean :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release-output
          cp "$APK" release-output/ROFOF-release.apk

      - name: Verify APK alignment, signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="release-output/ROFOF-release.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee release-output/signature-verification.txt
          grep -q "Verified" release-output/signature-verification.txt
          keytool -printcert -jarfile "$APK" > release-output/certificate-details.txt
          sha256sum "$APK" | tee release-output/SHA256SUMS.txt
          file "$APK" | tee release-output/file-type.txt
          unzip -t "$APK" | tail -n 2

      - name: Upload verified signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ROFOF-Signed-Release-APK
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
