name: ROFOF Debug APK

on:
  push:
    branches:
      - feat/rofof-apk-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rofof-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and upload ROFOF Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify required local assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/awareness/categories.json
          test -s app/src/main/assets/awareness/keywords_ar.json
          test -s app/src/main/assets/awareness/rules.json
          python3 -c 'import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding="utf-8")) for p in ["app/src/main/assets/awareness/categories.json", "app/src/main/assets/awareness/keywords_ar.json", "app/src/main/assets/awareness/rules.json"]]'
          test -s app/src/main/AndroidManifest.xml
          test -s app/build.gradle.kts
          echo "Required Android source assets are present."

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ROFOF-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
