name: ROFOF APK emulator install and launch

on:
  push:
    branches:
      - "feat/rofof-apk-integration"

permissions:
  actions: read
  contents: read

concurrency:
  group: rofof-apk-emulator-verify
  cancel-in-progress: true

jobs:
  install-and-launch:
    name: Install exact APK artifact and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact APK source commit
        uses: actions/checkout@v4
        with:
          ref: 427b2e69d62670c6fa63407393dd95835c739c7b

      - name: Download APK artifact from exact build run
        uses: actions/download-artifact@v4
        with:
          name: ROFOF-Debug-APK
          path: artifacts
          repository: c83491307-gif/ROFOFAQ
          run-id: 45445041235
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact identity and APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/app-debug.apk"
          test -s "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"
          echo "701fd37f692bcde1099bd36d04db9f1d3c931b13ac32ad5b0e612a2eac31a2a6  $APK" | sha256sum --check
          unzip -t "$APK" | tail -n 2
          echo "APK artifact is the exact binary built from 427b2e69d62670c6fa63407393dd95835c739c7b."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install emulator system image
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Install APK and launch app on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            set -euo pipefail
            APK="artifacts/app-debug.apk"
            PACKAGE="com.creazzy.rofof.debug"
            ACTIVITY="com.creazzy.rofof.app.MainActivity"

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q "1"
            echo "=== INSTALL ==="
            adb install -r "$APK"
            echo "=== PACKAGE PATH ==="
            adb shell pm path "$PACKAGE"
            echo "=== LAUNCH ==="
            adb logcat -c
            adb shell am force-stop "$PACKAGE" || true
            adb shell am start -W -n "$PACKAGE/$ACTIVITY"
            sleep 8
            echo "=== PROCESS ==="
            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            test -n "$PID"
            echo "Running PID: $PID"
            echo "=== RESUMED ACTIVITY ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee /tmp/rofof-resumed.txt
            grep -F "$PACKAGE/$ACTIVITY" /tmp/rofof-resumed.txt
            echo "=== CRASH CHECK ==="
            if adb logcat -d -v time | grep -E "FATAL EXCEPTION|Process: $PACKAGE"; then
              echo "Fatal app crash detected."
              exit 1
            fi
            echo "PASS: APK installed, launcher activity started, process alive, no fatal crash."
